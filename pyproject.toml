[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vcp"
version = "0.1.0"
description = "Taiwan stock VCP + CANSLIM-lite screener and backtest"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
    "scipy>=1.11",
    "pyarrow>=14",
    "mplfinance>=0.12.10b0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "jupyter>=1.0",
    "ipykernel>=6",
]
dashboard = [
    "streamlit>=1.30",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
